<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok AM Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #111; --primary: #ff0055; --secondary: #00f3ff; --text: #e0e0e0; --border: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Fira Code', monospace; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.1) 0%, transparent 50%); }
        .container { width: 100%; max-width: 800px; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 900; color: #fff; text-transform: uppercase; text-shadow: 0 0 10px var(--primary); }
        header p { color: var(--secondary); font-size: 13px; letter-spacing: 2px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input { flex: 1; background: #000; border: 1px solid var(--primary); padding: 15px; color: #fff; outline: none; font-family: 'Fira Code'; }
        .input-group button { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 0 30px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .input-group button:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
        .input-group button:disabled { border-color: #555; color: #555; cursor: not-allowed; box-shadow: none; }

        .status { margin-bottom: 20px; color: var(--primary); font-size: 14px; display: none; text-align: center; }
        .loader { display: none; text-align: center; color: var(--secondary); font-size: 15px; margin: 20px 0; }
        .loader span { animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

        .video-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; display: none; margin-bottom: 20px; }
        .video-grid { display: flex; gap: 20px; margin-bottom: 15px; }
        @media (max-width: 600px) { .video-grid { flex-direction: column; } }
        
        .video-preview { flex: 1; max-width: 220px; }
        .video-preview video { width: 100%; border-radius: 6px; border: 1px solid var(--primary); background: #000; }
        
        .video-info { flex: 2; }
        .author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .author img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--secondary); background: #222; }
        .author .name { font-family: 'Inter'; font-weight: bold; font-size: 16px; }
        .author .user { font-size: 12px; color: var(--secondary); }
        
        .title { font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 15px; }
        
        .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .stat-item { background: #000; padding: 6px 10px; border-radius: 4px; border: 1px solid #222; font-size: 11px; }
        .stat-item span { color: var(--primary); font-weight: bold; }

        .actions { display: flex; gap: 10px; }
        .btn-download { flex: 1; text-align: center; background: var(--primary); color: #fff; padding: 10px; font-weight: bold; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .btn-download.audio { background: transparent; border: 1px solid var(--secondary); color: var(--secondary); }

        .preset-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; display: none; }
        .preset-card h3 { font-family: 'Inter'; font-size: 18px; color: var(--secondary); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .link-box { background: #000; border-left: 3px solid var(--primary); padding: 12px; border-radius: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .link-box a { color: var(--secondary); text-decoration: none; font-size: 12px; word-break: break-all; }
        .copy-btn { background: var(--primary); color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: 'Inter'; font-size: 11px; }

        .keyword-box { background: #000; border-left: 3px solid #ffcc00; padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
        .keyword-box .type { color: #ffcc00; font-size: 10px; font-weight: bold; display: block; margin-bottom: 4px; }
        .empty-state { color: #555; font-size: 13px; text-align: center; padding: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TikTok AM Scraper</h1>
            <p>[ Extract Video + Deep Scan Comments ]</p>
        </header>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://vt.tiktok.com/..." value="https://vt.tiktok.com/ZSgvc5kMx/">
            <button id="scrapeBtn" onclick="startScrape()">SCAN</button>
        </div>

        <div class="status" id="errorBox"></div>
        <div class="loader" id="loader">> MEMBONGKAR KOMENTAR & BALASAN<span>_</span></div>

        <div class="video-card" id="videoCard">
            <div class="video-grid">
                <div class="video-preview">
                    <video id="resVideo" controls playsinline></video>
                </div>
                <div class="video-info">
                    <div class="author">
                        <img id="resAvatar" src="">
                        <div>
                            <div class="name" id="resNickname">Name</div>
                            <div class="user" id="resUsername">@user</div>
                        </div>
                    </div>
                    <div class="title" id="resTitle">Title...</div>
                    <div class="stats">
                        <div class="stat-item">▶ <span id="resViews">0</span></div>
                        <div class="stat-item">❤ <span id="resLikes">0</span></div>
                        <div class="stat-item">💬 <span id="resComments">0</span></div>
                        <div class="stat-item">↗ <span id="resShares">0</span></div>
                    </div>
                    <div class="actions">
                        <a href="#" id="dlVideo" target="_blank" class="btn-download">DOWNLOAD (NO WM)</a>
                        <a href="#" id="dlAudio" target="_blank" class="btn-download audio">AUDIO</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="preset-card" id="presetCard">
            <h3>🔗 Link Alight Motion (<span id="countLinks">0</span>)</h3>
            <div id="linksContainer"></div>

            <h3 style="margin-top: 20px;">🔍 Teks Menyebut Preset (<span id="countKeywords">0</span>)</h3>
            <div id="keywordsContainer"></div>
        </div>
    </div>

    <script>
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function startScrape() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Masukkan link TikTok dulu!');

            const btn = document.getElementById('scrapeBtn');
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const videoCard = document.getElementById('videoCard');
            const presetCard = document.getElementById('presetCard');

            btn.disabled = true; btn.innerText = 'SCANNING...';
            loader.style.display = 'block';
            errorBox.style.display = 'none';
            videoCard.style.display = 'none';
            presetCard.style.display = 'none';

            try {
                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const json = await res.json();

                if (json.success) {
                    const { video, scanResult } = json.data;

                    // AMAN: Pake Optional Chaining (?) biar gak crash
                    document.getElementById('resVideo').src = video?.play || '';
                    document.getElementById('resVideo').poster = video?.cover || '';
                    document.getElementById('resAvatar').src = video?.author?.avatar || 'https://ui-avatars.com/api/?name=Unknown&background=random';
                    document.getElementById('resNickname').innerText = video?.author?.nickname || 'Unknown User';
                    document.getElementById('resUsername').innerText = '@' + (video?.author?.username || 'unknown');
                    document.getElementById('resTitle').innerText = video?.title || 'No Title';
                    
                    document.getElementById('resViews').innerText = formatNumber(video?.stats?.views);
                    document.getElementById('resLikes').innerText = formatNumber(video?.stats?.likes);
                    document.getElementById('resComments').innerText = formatNumber(video?.stats?.comments);
                    document.getElementById('resShares').innerText = formatNumber(video?.stats?.shares);
                    
                    document.getElementById('dlVideo').href = video?.play || '#';
                    document.getElementById('dlAudio').href = video?.music || '#';
                    videoCard.style.display = 'block';

                    document.getElementById('countLinks').innerText = scanResult.links.length;
                    document.getElementById('countKeywords').innerText = scanResult.keywords.length;
                    
                    const linksContainer = document.getElementById('linksContainer');
                    linksContainer.innerHTML = '';
                    if (scanResult.links.length === 0) {
                        linksContainer.innerHTML = '<div class="empty-state">Gak ada link Alight Motion di komentar.</div>';
                    } else {
                        scanResult.links.forEach(link => {
                            linksContainer.innerHTML += `
                                <div class="link-box">
                                    <a href="${link}" target="_blank">${link}</a>
                                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${link}'); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy', 2000)">Copy</button>
                                </div>
                            `;
                        });
                    }

                    const kwContainer = document.getElementById('keywordsContainer');
                    kwContainer.innerHTML = '';
                    if (scanResult.keywords.length === 0) {
                        kwContainer.innerHTML = '<div class="empty-state">Gak ada teks preset yang ditemukan.</div>';
                    } else {
                        scanResult.keywords.forEach(kw => {
                            kwContainer.innerHTML += `
                                <div class="keyword-box">
                                    <span class="type">${kw.type}</span>
                                    "${kw.text}"
                                </div>
                            `;
                        });
                    }

                    presetCard.style.display = 'block';
                } else {
                    throw new Error(json.error);
                }
            } catch (err) {
                errorBox.innerText = `[ ERROR ]: ${err.message}`;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false; btn.innerText = 'SCAN';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
