<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Scraper - Cyber</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --surface: #111; --primary: #ff0055; /* Warna Pink TikTok */
            --secondary: #00f3ff; --text: #e0e0e0; --border: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Fira Code', monospace; 
            min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.1) 0%, transparent 50%);
        }

        .container { width: 100%; max-width: 800px; }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { 
            font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 900; 
            color: #fff; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); margin-bottom: 10px;
        }
        header p { color: var(--secondary); font-size: 14px; letter-spacing: 2px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input { 
            flex: 1; background: #000; border: 1px solid var(--primary); 
            padding: 15px; color: #fff; font-family: 'Fira Code', monospace; 
            outline: none; font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2) inset;
        }
        .input-group button {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 0 30px; font-weight: 700; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .input-group button:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
        .input-group button:disabled { border-color: #555; color: #555; cursor: not-allowed; box-shadow: none; background: transparent; }

        .status { margin-bottom: 20px; color: var(--primary); font-size: 14px; display: none; text-align: center; }
        .loader { display: none; text-align: center; color: var(--secondary); font-size: 16px; margin: 30px 0; }
        .loader span { animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

        /* HASIL SCRAPE */
        .result-card { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 25px; border-radius: 8px; display: none; 
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .result-grid { display: flex; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 600px) { .result-grid { flex-direction: column; } }

        .video-preview { flex: 1; max-width: 250px; }
        .video-preview video { width: 100%; border-radius: 8px; border: 2px solid var(--primary); box-shadow: 0 0 15px rgba(255,0,85,0.4); }

        .info { flex: 2; display: flex; flex-direction: column; justify-content: center; }
        .author { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .author img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--secondary); }
        .author-name { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
        .author-user { font-size: 12px; color: var(--secondary); }
        
        .title { font-size: 14px; line-height: 1.5; color: #aaa; margin-bottom: 20px; border-left: 2px solid var(--primary); padding-left: 10px; }

        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-item { background: #000; padding: 8px 12px; border-radius: 4px; border: 1px solid #222; font-size: 12px; }
        .stat-item span { color: var(--primary); font-weight: 700; }

        .actions { display: flex; gap: 10px; }
        .btn-download {
            flex: 1; text-align: center; text-decoration: none;
            background: var(--primary); color: #fff; padding: 12px;
            font-weight: 700; border-radius: 4px; font-size: 14px; transition: 0.3s;
        }
        .btn-download.audio { background: transparent; border: 1px solid var(--secondary); color: var(--secondary); }
        .btn-download:hover { opacity: 0.8; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TikTok Scraper</h1>
            <p>[ Extract Video, Audio & Stats ]</p>
        </header>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://vt.tiktok.com/..." value="https://vt.tiktok.com/ZSgvc5kMx/">
            <button id="scrapeBtn" onclick="startScrape()">SCAN</button>
        </div>

        <div class="status" id="errorBox"></div>
        <div class="loader" id="loader">> BYPASSING TIKTOK SECURITY<span>_</span></div>

        <div class="result-card" id="resultCard">
            <div class="result-grid">
                <div class="video-preview">
                    <video id="resVideo" controls poster="" playsinline></video>
                </div>
                <div class="info">
                    <div class="author">
                        <img id="resAvatar" src="" alt="Avatar">
                        <div>
                            <div class="author-name" id="resNickname">Nickname</div>
                            <div class="author-user" id="resUsername">@username</div>
                        </div>
                    </div>
                    <div class="title" id="resTitle">Video Title...</div>
                    
                    <div class="stats">
                        <div class="stat-item">▶ <span id="resViews">0</span></div>
                        <div class="stat-item">❤ <span id="resLikes">0</span></div>
                        <div class="stat-item">💬 <span id="resComments">0</span></div>
                        <div class="stat-item">↗ <span id="resShares">0</span></div>
                    </div>

                    <div class="actions">
                        <a href="#" id="dlVideo" target="_blank" class="btn-download">DOWNLOAD VIDEO (NO WM)</a>
                        <a href="#" id="dlAudio" target="_blank" class="btn-download audio">AUDIO</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function startScrape() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Masukkan link TikTok dulu!');

            const btn = document.getElementById('scrapeBtn');
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const resultCard = document.getElementById('resultCard');

            btn.disabled = true; btn.innerText = 'SCANNING...';
            loader.style.display = 'block';
            errorBox.style.display = 'none';
            resultCard.style.display = 'none';

            try {
                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const json = await res.json();

                if (json.success) {
                    const data = json.data;

                    // Isi Data Video
                    document.getElementById('resVideo').src = data.play;
                    document.getElementById('resVideo').poster = data.cover;
                    
                    // Isi Author
                    document.getElementById('resAvatar').src = data.author.avatar;
                    document.getElementById('resNickname').innerText = data.author.nickname;
                    document.getElementById('resUsername').innerText = '@' + data.author.username;
                    
                    // Isi Title & Stats
                    document.getElementById('resTitle').innerText = data.title;
                    document.getElementById('resViews').innerText = formatNumber(data.stats.views);
                    document.getElementById('resLikes').innerText = formatNumber(data.stats.likes);
                    document.getElementById('resComments').innerText = formatNumber(data.stats.comments);
                    document.getElementById('resShares').innerText = formatNumber(data.stats.shares);
                    
                    // Isi Link Download
                    document.getElementById('dlVideo').href = data.play;
                    document.getElementById('dlAudio').href = data.music;

                    resultCard.style.display = 'block';
                } else {
                    throw new Error(json.error);
                }
            } catch (err) {
                errorBox.innerText = `[ ERROR ]: ${err.message}`;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false; btn.innerText = 'SCAN';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
