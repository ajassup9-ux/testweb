<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG DNA - Web Inspector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="bg-container"></div>
    <div class="bg-overlay"></div>

    <nav>
        <div class="logo">&lt;TG_DNA /&gt;</div>
        <div class="links"><a href="#" class="active">System</a></div>
    </nav>

    <main class="container">
        <div class="header-section reveal">
            <h1 class="title">Telegram <span class="neon-text">DNA</span></h1>
            <p class="subtitle">OSINT Engine & Account Inspector</p>
        </div>

        <!-- LOGIN SECTION -->
        <div class="glass-panel reveal" id="authPanel">
            <div class="input-card">
                <div class="input-group"><input type="text" id="phone" placeholder="+62812345678"></div>
                <div class="input-group"><input type="number" id="apiId" placeholder="API ID"></div>
                <div class="input-group"><input type="password" id="apiHash" placeholder="API HASH"></div>
                <button class="btn-primary" id="btnSend" onclick="sendOTP()">LOGIN AUTH</button>
            </div>
            <div class="input-card hidden" id="stepOTP">
                <div class="input-group"><input type="text" id="otpCode" placeholder="Kode OTP"></div>
                <button class="btn-primary" id="btnVerify" onclick="verifyOTP()">VERIFY OTP</button>
            </div>
            <div class="input-card hidden" id="step2FA">
                <div class="input-group"><input type="password" id="twoFA" placeholder="Password 2FA"></div>
                <button class="btn-primary" id="btn2FA" onclick="verify2FA()">VERIFY 2FA</button>
            </div>
        </div>

        <!-- MAIN MENU -->
        <div id="mainMenu" class="hidden">
            <div class="menu-grid reveal">
                <button class="menu-btn" onclick="selectType('User')">
                    <span class="icon">👤</span> User
                </button>
                <button class="menu-btn" onclick="selectType('Channel')">
                    <span class="icon">📢</span> Channel
                </button>
                <button class="menu-btn" onclick="selectType('Group')">
                    <span class="icon">👥</span> Group
                </button>
                <button class="menu-btn" onclick="selectType('Bot')">
                    <span class="icon">🤖</span> Bot
                </button>
            </div>

            <div class="glass-panel reveal hidden" id="targetPanel">
                <h3 style="color: var(--primary); margin-bottom: 10px;" id="targetTitle">Masukkan Target User</h3>
                <div class="input-card" style="padding: 0; flex-direction: row;">
                    <div class="input-group">
                        <input type="text" id="targetInput" placeholder="@username, t.me/username, atau ID">
                    </div>
                    <button class="btn-primary" id="btnScan" onclick="startScan()">SCAN</button>
                </div>
            </div>
        </div>

        <!-- TERMINAL OUTPUT -->
        <div class="terminal-panel glass-panel reveal" style="margin-top: 20px;">
            <div class="terminal-header">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span class="title">dna_result.txt</span>
            </div>
            <div class="terminal-body" id="terminalOutput">
                <div class="log-line">> System initialized. Waiting for auth...</div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
