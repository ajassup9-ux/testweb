<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Class Voting</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #d0d0d0;
            --accent-purple: #8a2be2;
            --accent-pink: #ff007f;
            --accent-gradient: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            --glow: 0 0 15px rgba(255, 0, 127, 0.6);
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        * { box-sizing: border-box; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
        body { color: var(--text-main); display: flex; justify-content: center; background-color: #000; }

        /* WALLPAPER CATBOX */
        #app {
            width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative;
            background: linear-gradient(rgba(15, 12, 41, 0.6), rgba(15, 12, 41, 0.85)), 
                        url('https://files.catbox.moe/t4xixi.jpg') center/cover no-repeat;
            z-index: 1; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        header { padding: 25px 20px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        header h1 {
            font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: 1px;
            background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .header-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: var(--text-main); font-size: 18px; width: 42px; height: 42px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .icon-btn:active { background: rgba(255,255,255,0.3); }
        .delete-btn { color: #ff4d4d; border-color: rgba(255, 77, 77, 0.3); }

        .user-bar {
            margin: 0 20px 15px; background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); padding: 12px 18px; border-radius: 16px;
            display: flex; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .user-bar span { color: var(--text-muted); font-weight: 600; }
        .user-bar input {
            flex-grow: 1; background: transparent; border: none; color: var(--accent-pink);
            font-weight: 700; outline: none; font-size: 15px; font-family: var(--font-head);
        }

        main { flex-grow: 1; overflow-y: auto; padding: 10px 20px 100px; display: flex; flex-direction: column; gap: 20px; }

        .poll-card {
            background: rgba(20, 20, 30, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .creator-name { font-size: 12px; color: var(--accent-pink); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
        .poll-header h3 { font-family: var(--font-head); font-size: 18px; margin-bottom: 6px; line-height: 1.3; }
        .poll-type { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }

        .poll-options { display: flex; flex-direction: column; gap: 10px; }
        .option-item {
            display: flex; align-items: flex-start; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 14px 16px;
            cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .option-item.selected { border-color: var(--accent-purple); background: rgba(138, 43, 226, 0.2); }

        .radio-circle {
            width: 20px; height: 20px; border: 2px solid #777; border-radius: 50%; margin-right: 12px;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0; z-index: 2; margin-top: 2px;
        }
        .option-item.selected .radio-circle { background: var(--accent-gradient); border-color: transparent; box-shadow: var(--glow); }
        .option-item.selected .radio-circle::after { content: '✓'; color: white; font-size: 12px; font-weight: bold; }

        .option-content { flex-grow: 1; display: flex; flex-direction: column; z-index: 2; }
        .option-text { font-size: 15px; font-weight: 600; line-height: 1.4; }
        .voters-list { font-size: 11px; color: #ffb3d9; margin-top: 6px; font-weight: 600; display: none; }
        .option-item.voted .voters-list { display: block; }

        .vote-count { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--accent-pink); z-index: 2; margin-left: 10px; display: none; }
        .option-item.voted .vote-count { display: block; }

        .progress-bar {
            position: absolute; left: 0; top: 0; height: 100%;
            background: linear-gradient(90deg, rgba(138,43,226,0.3), rgba(255,0,127,0.3));
            z-index: 1; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); display: none;
        }
        .option-item.voted .progress-bar { display: block; }

        .poll-footer { margin-top: 20px; display: flex; justify-content: flex-end; align-items: center; font-size: 12px; }
        .vote-btn {
            background: var(--accent-gradient); color: white; border: none; padding: 10px 24px; border-radius: 12px;
            cursor: pointer; font-weight: 700; font-family: var(--font-head); font-size: 14px; display: none; box-shadow: var(--glow);
        }
        .vote-btn.active { display: block; }
        .voted-badge { color: var(--accent-pink); font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 5px; }

        .fab {
            position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--accent-gradient); border-radius: 20px; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 28px; box-shadow: 0 8px 20px rgba(255, 0, 127, 0.5); cursor: pointer; z-index: 10;
        }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 12, 41, 0.95), rgba(15, 12, 41, 0.98)), url('https://files.catbox.moe/t4xixi.jpg') center/cover no-repeat;
            z-index: 999; display: none; flex-direction: column;
        }
        .modal.active { display: flex !important; }
        .modal-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--glass-border); }
        .modal-header h2 { font-family: var(--font-head); font-size: 20px; }
        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .required-star { color: #ff4d4d; font-size: 14px; }
        .input-field {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 15px; color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--accent-purple); background: rgba(138, 43, 226, 0.1); }

        .add-option-btn { background: transparent; color: var(--accent-pink); border: 1px dashed var(--accent-pink); padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: 600; margin-bottom: 20px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-top: 1px solid var(--glass-border); font-size: 14px; font-weight: 500; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--accent-gradient); }
        input:checked + .slider:before { transform: translateX(20px); }

        .submit-btn { background: var(--accent-gradient); color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; font-family: var(--font-head); cursor: pointer; margin-top: 30px; box-shadow: var(--glow); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>VIBE VOTING ✦</h1>
        <div class="header-actions">
            <button type="button" class="icon-btn delete-btn" onclick="clearAllPolls()">🗑️</button>
            <button type="button" class="icon-btn" onclick="openCreateModal()">+</button>
        </div>
    </header>

    <div class="user-bar">
        <span>ID: <span class="required-star">*</span></span>
        <input type="text" id="userNameInput" placeholder="Ketik namamu dulu..." oninput="saveUserName()">
    </div>

    <main id="pollContainer">
        <div style="text-align:center; padding:20px; color:#d0d0d0;">Menghubungkan ke server...</div>
    </main>

    <div class="fab" onclick="openCreateModal()">✦</div>

    <div class="modal" id="createModal">
        <div class="modal-header">
            <button type="button" class="icon-btn" onclick="closeCreateModal()">←</button>
            <h2>Buat Polling</h2>
        </div>
        
        <div class="modal-body">
            <div class="input-group">
                <label>Nama Pembuat <span class="required-star">*</span></label>
                <input type="text" id="creatorNameInput" class="input-field" placeholder="Namamu siapa?" maxlength="50">
            </div>

            <div class="input-group">
                <label>Pertanyaan <span class="required-star">*</span></label>
                <input type="text" id="pollQuestion" class="input-field" placeholder="Mau nanya apa?" maxlength="255">
            </div>

            <div class="input-group" id="optionsContainer">
                <label>Pilihan Jawaban <span class="required-star">*</span></label>
            </div>

            <button type="button" class="add-option-btn" onclick="addOptionInput()">+ Tambah Pilihan</button>

            <div class="setting-row">
                <span>Bisa pilih lebih dari 1?</span>
                <label class="switch">
                    <input type="checkbox" id="allowMultiple">
                    <span class="slider"></span>
                </label>
            </div>

            <button type="button" class="submit-btn" onclick="createPoll()">Publish Voting 🚀</button>
        </div>
    </div>
</div>

<script>
    // =====================================================================
    // ⚠️ GANTI URL DI BAWAH INI DENGAN URL API NPOINT MILIKMU ⚠️
    // =====================================================================
    const API_URL = "https://api.npoint.io/727cfe7460218bdb0fb0"; 
    // =====================================================================

    if (API_URL === "") {
        alert("⚠️ STOP! Kamu belum memasukkan URL npoint.io di dalam kode. Baca panduan di atas!");
    }

    let currentUser = '';
    let tempSelections = {};
    let polls = []; 
    let votedPolls = []; 

    try {
        const storedName = localStorage.getItem('current_user_name');
        if (storedName) currentUser = storedName;
        const storedVoted = localStorage.getItem('voted_polls_v6');
        if (storedVoted) votedPolls = JSON.parse(storedVoted);
    } catch(e) {}

    document.addEventListener('DOMContentLoaded', () => {
        if (currentUser) document.getElementById('userNameInput').value = currentUser;
        addOptionInput(); addOptionInput();
        fetchPolls(); // Ambil data dari server
    });

    function saveUserName() {
        currentUser = document.getElementById('userNameInput').value.trim();
        try { localStorage.setItem('current_user_name', currentUser); } catch(e) {}
    }

    function saveVoted() {
        try { localStorage.setItem('voted_polls_v6', JSON.stringify(votedPolls)); } catch(e) {}
    }

    // ================= FETCH DATA DARI SERVER =================
    function fetchPolls() {
        const container = document.getElementById('pollContainer');
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#d0d0d0;">Memuat data...</div>';

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                polls = data || [];
                renderPolls();
            })
            .catch(err => {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#ff4d4d;">Gagal memuat data. Cek koneksi atau URL npoint.</div>';
            });
    }

    // ================= SIMPAN DATA KE SERVER =================
    function saveToServer(callback) {
        fetch(API_URL, {
            method: 'POST', // npoint.io menggunakan POST untuk menimpa data lama dengan baru
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(polls)
        })
        .then(() => {
            if(callback) callback();
        })
        .catch(err => alert("Gagal menyimpan data ke server. Coba lagi."));
    }

    function clearAllPolls() {
        if (polls.length === 0) return alert("Belum ada data.");
        if (confirm("⚠️ Hapus SEMUA votingan dari server? Orang lain juga akan kehilangan datanya!")) {
            polls = [];
            votedPolls = [];
            saveVoted();
            saveToServer(() => {
                renderPolls();
            });
        }
    }

    function renderPolls() {
        const container = document.getElementById('pollContainer');
        container.innerHTML = '';

        if (polls.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#d0d0d0; padding:20px; background:rgba(0,0,0,0.5); border-radius:20px;">Belum ada votingan nih.<br>Klik tombol + untuk bikin!</div>';
            return;
        }

        polls.slice().reverse().forEach(poll => {
            const hasVoted = votedPolls.includes(poll.id);
            const totalVotes = poll.options.reduce((sum, opt) => sum + opt.voters.length, 0);
            
            const card = document.createElement('div');
            card.className = 'poll-card';

            let typeText = poll.allowMultiple ? 'Multi-Choice' : 'Single-Choice';
            let headerHTML = `
                <div class="creator-name">CREATED BY: ${poll.creator}</div>
                <div class="poll-header">
                    <h3>${poll.question}</h3>
                    <div class="poll-type">⚡ ${typeText}</div>
                </div>
                <div class="poll-options">
            `;

            poll.options.forEach(opt => {
                let percentage = totalVotes === 0 ? 0 : Math.round((opt.voters.length / totalVotes) * 100);
                let selectedClass = (!hasVoted && tempSelections[poll.id] && tempSelections[poll.id].includes(opt.id)) ? 'selected' : (hasVoted ? 'voted' : '');
                
                let votersHTML = (hasVoted && opt.voters.length > 0) ? `<div class="voters-list">👤 ${opt.voters.join(', ')}</div>` : '';
                let progressBar = hasVoted ? `<div class="progress-bar" style="width: ${percentage}%;"></div>` : '';
                let voteCountText = hasVoted ? `<span class="vote-count">${opt.voters.length}</span>` : '';

                headerHTML += `
                    <div class="option-item ${selectedClass}" onclick="toggleSelection('${poll.id}', '${opt.id}')">
                        ${progressBar}
                        <div class="radio-circle"></div>
                        <div class="option-content">
                            <div class="option-text">${opt.text}</div>
                            ${votersHTML}
                        </div>
                        ${voteCountText}
                    </div>
                `;
            });

            headerHTML += `</div>`; 

            let footerHTML = '';
            if (!hasVoted) {
                let isSelected = tempSelections[poll.id] && tempSelections[poll.id].length > 0;
                footerHTML = `<div class="poll-footer"><button type="button" class="vote-btn ${isSelected ? 'active' : ''}" onclick="submitVote('${poll.id}')">Kirim Suara</button></div>`;
            } else {
                footerHTML = `<div class="poll-footer" style="justify-content: space-between; width:100%;"><span class="voted-badge">✓ Kamu sudah vote</span><span style="color: var(--text-muted); font-weight:600;">${totalVotes} Suara</span></div>`;
            }

            card.innerHTML = headerHTML + footerHTML;
            container.appendChild(card);
        });
    }

    function toggleSelection(pollId, optionId) {
        if (votedPolls.includes(pollId)) return; 
        const poll = polls.find(p => p.id === pollId);
        if (!poll) return;

        if (!tempSelections[pollId]) tempSelections[pollId] = [];
        let index = tempSelections[pollId].indexOf(optionId);

        if (poll.allowMultiple) {
            if (index > -1) tempSelections[pollId].splice(index, 1); 
            else tempSelections[pollId].push(optionId); 
        } else {
            tempSelections[pollId] = [optionId]; 
        }
        renderPolls(); 
    }

    function submitVote(pollId) {
        if (!currentUser) {
            alert('Wajib isi ID/Nama kamu di atas sebelum vote!');
            document.getElementById('userNameInput').focus();
            return;
        }

        if (!tempSelections[pollId] || tempSelections[pollId].length === 0) return;

        const pollIndex = polls.findIndex(p => p.id === pollId);
        if (pollIndex === -1) return;

        tempSelections[pollId].forEach(selectedOptId => {
            const optIndex = polls[pollIndex].options.findIndex(o => o.id === selectedOptId);
            if (optIndex !== -1 && !polls[pollIndex].options[optIndex].voters.includes(currentUser)) {
                polls[pollIndex].options[optIndex].voters.push(currentUser);
            }
        });

        votedPolls.push(pollId);
        saveVoted();
        delete tempSelections[pollId];
        
        // Simpan ke server, lalu render ulang
        saveToServer(() => {
            renderPolls(); 
        });
    }

    function openCreateModal() {
        document.getElementById('createModal').classList.add('active');
        document.getElementById('creatorNameInput').value = currentUser || '';
        document.getElementById('pollQuestion').value = '';
        document.getElementById('allowMultiple').checked = true;
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '<label>Pilihan Jawaban <span class="required-star">*</span></label>';
        addOptionInput(); addOptionInput();
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.remove('active');
    }

    function addOptionInput() {
        const container = document.getElementById('optionsContainer');
        const inputDiv = document.createElement('div');
        inputDiv.style.marginBottom = '10px';
        inputDiv.innerHTML = `<input type="text" class="input-field option-input" placeholder="Teks Pilihan..." maxlength="100">`;
        container.appendChild(inputDiv);
    }

    function createPoll() {
        const creator = document.getElementById('creatorNameInput').value.trim();
        const question = document.getElementById('pollQuestion').value.trim();
        const allowMultiple = document.getElementById('allowMultiple').checked;
        const optionInputs = document.querySelectorAll('.option-input');
        
        let options = [];
        optionInputs.forEach(input => {
            if (input.value.trim() !== '') {
                options.push({ id: 'opt_' + Math.random().toString(36).substr(2, 9), text: input.value.trim(), voters: [] });
            }
        });

        if (creator === '' || question === '' || options.length < 2) {
            alert('Isi nama, pertanyaan, dan minimal 2 pilihan!');
            return;
        }

        const newPoll = {
            id: 'poll_' + Date.now().toString(),
            creator: creator,
            question: question,
            allowMultiple: allowMultiple,
            options: options,
            date: Date.now()
        };

        polls.push(newPoll);
        
        // Simpan ke server
        saveToServer(() => {
            closeCreateModal();
            renderPolls();
        });
    }
</script>

</body>
</html>
