<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polling Kelas</title>
    <style>
        :root {
            --bg-main: #0b141a;
            --bg-header: #202c33;
            --bg-chat: #0b141a;
            --poll-bg: #005c4b;
            --text-main: #e9edef;
            --text-secondary: #8696a0;
            --border-color: #2f3b43;
            --btn-green: #00a884;
            --option-bg: #025144;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container HP */
        #app {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-size: cover;
            background-blend-mode: overlay;
            background-color: rgba(11, 20, 26, 0.95); /* Efek gelap */
            position: relative;
        }

        /* Header */
        header {
            background-color: var(--bg-header);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 18px;
            font-weight: 500;
            flex-grow: 1;
        }

        .back-btn, .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        /* Area Chat / Polling */
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Card Polling */
        .poll-card {
            background-color: var(--poll-bg);
            border-radius: 10px;
            padding: 12px;
            align-self: flex-end; /* Rata kanan seperti chat */
            width: 85%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            position: relative;
        }

        .poll-header h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .poll-header p {
            font-size: 12px;
            color: #d1d7db;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Opsi Voting */
        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s;
        }

        .option-item:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }

        /* Custom Radio/Checkbox */
        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #8696a0;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
        }

        .option-item.selected .radio-circle {
            background-color: var(--btn-green);
            border-color: var(--btn-green);
        }

        .option-item.selected .radio-circle::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .option-text {
            flex-grow: 1;
            font-size: 15px;
            z-index: 2;
        }

        .vote-count {
            font-size: 13px;
            color: #d1d7db;
            z-index: 2;
        }

        /* Bar Persentase (Setelah vote) */
        .progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 1;
            transition: width 0.5s ease;
        }

        /* Footer Card Polling */
        .poll-footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            font-size: 12px;
            color: #d1d7db;
        }

        .vote-btn {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Sembunyikan awalnya */
        }
        
        .vote-btn.active {
            display: block;
        }

        /* FAB (Tombol Buat Polling) */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background-color: var(--btn-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111b21;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* Modal Buat Polling */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-main);
            z-index: 20;
            display: none;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--btn-green);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3b4a54; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--btn-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .submit-btn {
            background-color: var(--btn-green);
            color: #111b21;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header>
        <button class="back-btn" id="headerBackBtn" onclick="goBack()">←</button>
        <h1 id="headerTitle">Grup Kelas</h1>
        <button class="icon-btn" id="headerCreateBtn" onclick="openCreateModal()">⋮</button>
    </header>

    <!-- Area Chat -->
    <main id="pollContainer">
        <!-- Card Polling akan di-render lewat JS -->
    </main>

    <!-- FAB (Tombol Tambah Polling) -->
    <div class="fab" id="fabBtn" onclick="openCreateModal()">+</div>

    <!-- Modal Buat Polling -->
    <div class="modal" id="createModal">
        <header>
            <button class="back-btn" onclick="closeCreateModal()">←</button>
            <h1>Buat polling</h1>
        </header>
        
        <div class="modal-body">
            <div class="input-group">
                <label>Pertanyaan</label>
                <input type="text" id="pollQuestion" class="input-field" placeholder="Ajukan pertanyaan" maxlength="255">
            </div>

            <div class="input-group" id="optionsContainer">
                <label>Pilihan</label>
                <!-- Input opsi akan ditambahkan lewat JS -->
            </div>

            <button class="icon-btn" onclick="addOptionInput()" style="color: var(--btn-green); font-size: 15px; margin-bottom: 20px;">+ Tambah pilihan</button>

            <div class="setting-row">
                <span>Izinkan beberapa jawaban</span>
                <label class="switch">
                    <input type="checkbox" id="allowMultiple">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="setting-row">
                <span>Sembunyikan nama pemilih</span>
                <label class="switch">
                    <input type="checkbox" id="hideVoters" checked disabled> <!-- Disabled sementara -->
                    <span class="slider"></span>
                </label>
            </div>

            <button class="submit-btn" onclick="createPoll()">Kirim</button>
        </div>
    </div>
</div>

<script>
    // State Data
    let polls = JSON.parse(localStorage.getItem('class_polls')) || [];
    // Simpan ID polling yang sudah di-vote user ini (biar ga bisa vote 2x)
    let votedPolls = JSON.parse(localStorage.getItem('voted_polls')) || [];
    // Simpan pilihan sementara sebelum klik "Kirim suara"
    let tempSelections = {}; 

    // Render saat halaman dibuka
    document.addEventListener('DOMContentLoaded', () => {
        renderPolls();
        addOptionInput(); // Tambah 2 opsi default di form
        addOptionInput();
    });

    // ================= LOGIC RENDER POLLING =================
    function renderPolls() {
        const container = document.getElementById('pollContainer');
        container.innerHTML = '';

        if (polls.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#8696a0; margin-top:50px;">Belum ada polling.<br>Klik tombol + untuk membuat.</div>';
            return;
        }

        // Render dari yang terbaru
        polls.slice().reverse().forEach(poll => {
            const hasVoted = votedPolls.includes(poll.id);
            const totalVotes = poll.options.reduce((sum, opt) => sum + opt.votes, 0);
            
            // Buat Card HTML
            const card = document.createElement('div');
            card.className = 'poll-card';

            // Header Poll
            let typeText = poll.allowMultiple ? 'Pilih satu atau lebih' : 'Pilih satu';
            let headerHTML = `
                <div class="poll-header">
                    <h3>${poll.question}</h3>
                    <p>☑️ ${typeText}</p>
                </div>
                <div class="poll-options">
            `;

            // Render Opsi
            poll.options.forEach(opt => {
                let percentage = totalVotes === 0 ? 0 : Math.round((opt.votes / totalVotes) * 100);
                let selectedClass = '';
                
                if (!hasVoted) {
                    // Cek jika sebelumnya sudah dipilih sementara
                    if(tempSelections[poll.id] && tempSelections[poll.id].includes(opt.id)) {
                        selectedClass = 'selected';
                    }
                } else {
                    // Jika sudah vote, tampilkan bar progress
                    selectedClass = 'voted';
                }

                let progressBar = hasVoted ? `<div class="progress-bar" style="width: ${percentage}%;"></div>` : '';
                let voteCountText = hasVoted ? `<span class="vote-count">${opt.votes}</span>` : '';

                headerHTML += `
                    <div class="option-item ${selectedClass}" onclick="toggleSelection('${poll.id}', '${opt.id}')">
                        ${progressBar}
                        <div class="radio-circle"></div>
                        <div class="option-text">${opt.text}</div>
                        ${voteCountText}
                    </div>
                `;
            });

            headerHTML += `</div>`; // Tutup poll-options

            // Footer (Tombol Kirim / Total Suara)
            let footerHTML = '';
            if (!hasVoted) {
                // Cek apakah ada opsi yang dipilih
                let isSelected = tempSelections[poll.id] && tempSelections[poll.id].length > 0;
                footerHTML = `
                    <div class="poll-footer" style="border:none; padding-top:5px; justify-content:flex-end;">
                        <button class="vote-btn ${isSelected ? 'active' : ''}" onclick="submitVote('${poll.id}')">Kirim suara</button>
                    </div>
                `;
            } else {
                footerHTML = `
                    <div class="poll-footer" style="color: #00a884;">
                        <span>Lihat jumlah suara</span>
                        <span>${new Date(poll.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ✓✓</span>
                    </div>
                `;
            }

            card.innerHTML = headerHTML + footerHTML;
            container.appendChild(card);
        });
    }

    // ================= LOGIC PEMILIHAN (SEBELUM KIRIM) =================
    function toggleSelection(pollId, optionId) {
        if (votedPolls.includes(pollId)) return; // Jika sudah vote, abaikan klik

        const poll = polls.find(p => p.id === pollId);
        if (!poll) return;

        if (!tempSelections[pollId]) {
            tempSelections[pollId] = [];
        }

        let index = tempSelections[pollId].indexOf(optionId);

        if (poll.allowMultiple) {
            // Jika milih banyak (checkbox)
            if (index > -1) {
                tempSelections[pollId].splice(index, 1); // Hapus jika diklik lagi
            } else {
                tempSelections[pollId].push(optionId); // Tambah
            }
        } else {
            // Jika milih satu (radio)
            tempSelections[pollId] = [optionId]; // Timpa dengan pilihan baru
        }

        renderPolls(); // Render ulang untuk update UI
    }

    // ================= LOGIC KIRIM SUARA =================
    function submitVote(pollId) {
        if (!tempSelections[pollId] || tempSelections[pollId].length === 0) return;

        const pollIndex = polls.findIndex(p => p.id === pollId);
        if (pollIndex === -1) return;

        // Tambahkan suara ke setiap opsi yang dipilih
        tempSelections[pollId].forEach(selectedOptId => {
            const optIndex = polls[pollIndex].options.findIndex(o => o.id === selectedOptId);
            if (optIndex !== -1) {
                polls[pollIndex].options[optIndex].votes += 1;
            }
        });

        // Tandai sudah vote
        votedPolls.push(pollId);
        
        // Simpan ke LocalStorage
        localStorage.setItem('class_polls', JSON.stringify(polls));
        localStorage.setItem('voted_polls', JSON.stringify(votedPolls));

        // Hapus dari tempSelections
        delete tempSelections[pollId];

        renderPolls(); // Update tampilan
    }

    // ================= LOGIC BUAT POLLING BARU =================
    function openCreateModal() {
        document.getElementById('createModal').classList.add('active');
        document.getElementById('pollQuestion').value = '';
        document.getElementById('allowMultiple').checked = true;
        
        // Reset input options jadi 2 kosong
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '<label>Pilihan</label>';
        addOptionInput();
        addOptionInput();
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.remove('active');
    }

    function addOptionInput() {
        const container = document.getElementById('optionsContainer');
        const inputDiv = document.createElement('div');
        inputDiv.style.marginBottom = '10px';
        inputDiv.innerHTML = `<input type="text" class="input-field option-input" placeholder="+ Tambah" maxlength="100">`;
        container.appendChild(inputDiv);
    }

    function createPoll() {
        const question = document.getElementById('pollQuestion').value.trim();
        const allowMultiple = document.getElementById('allowMultiple').checked;
        const optionInputs = document.querySelectorAll('.option-input');
        
        // Ambil nilai opsi yang tidak kosong
        let options = [];
        optionInputs.forEach(input => {
            if (input.value.trim() !== '') {
                options.push({
                    id: 'opt_' + Math.random().toString(36).substr(2, 9),
                    text: input.value.trim(),
                    votes: 0
                });
            }
        });

        // Validasi
        if (question === '') {
            alert('Pertanyaan tidak boleh kosong!');
            return;
        }
        if (options.length < 2) {
            alert('Minimal isi 2 pilihan!');
            return;
        }

        // Buat objek poll baru
        const newPoll = {
            id: 'poll_' + Date.now().toString(),
            question: question,
            allowMultiple: allowMultiple,
            options: options,
            date: Date.now()
        };

        // Simpan
        polls.push(newPoll);
        localStorage.setItem('class_polls', JSON.stringify(polls));

        // Tutup modal & render ulang
        closeCreateModal();
        renderPolls();
    }

    // Kembali ke menu utama dari modal
    function goBack() {
        // Fungsi dummy untuk header utama (karena cuma 1 halaman)
        // Bisa diarahkan ke link lain jika ada
        alert("Ini adalah halaman utama grup kelas.");
    }
</script>

</body>
</html>
