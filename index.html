<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Preset Finder - Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f; --surface: #1a1a1d; --primary: #00fa7e;
            --primary-dim: rgba(0, 250, 126, 0.15); --text: #ffffff;
            --text-muted: #8a8d93; --border: #2a2a2d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
        .logo-icon { width: 32px; height: 32px; border: 2px solid var(--text-muted); border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .logo-icon svg { width: 20px; height: 20px; fill: var(--primary); }

        main { flex: 1; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .search-container { display: flex; gap: 12px; margin-bottom: 16px; }
        .input-wrapper { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 16px; }
        .input-wrapper svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; margin-right: 12px; }
        .input-wrapper input { background: none; border: none; color: var(--text); width: 100%; padding: 14px 0; font-size: 14px; outline: none; }
        .btn-primary { background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 0 24px; font-weight: 700; font-size: 14px; cursor: pointer; }

        .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 24px; }
        .pill { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 12px; white-space: nowrap; }

        .loading-state { display: none; flex-direction: column; align-items: center; padding: 40px 0; gap: 16px; }
        .loading-state.active { display: flex; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(0, 250, 126, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-state { display: none; flex-direction: column; gap: 16px; }
        .result-state.active { display: flex; }
        .video-box { width: 100%; aspect-ratio: 9/16; max-height: 500px; background: #222; border-radius: 8px; background-size: cover; background-position: center; }
        .caption-text { font-size: 13px; color: #e0e0e0; line-height: 1.5; word-wrap: break-word; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin: 8px 0; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .avatar-sm { width: 20px; height: 20px; border-radius: 50%; background-size: cover; background-position: center; }

        .audio-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .audio-info { display: flex; align-items: center; gap: 12px; }
        .audio-thumb { width: 44px; height: 44px; border-radius: 50%; background-size: cover; background-position: center; position: relative; }
        .audio-title { font-size: 14px; font-weight: 600; }
        .audio-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .preset-section-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; margin-top: 10px; margin-bottom: 16px; }
        .preset-section-title span { color: var(--primary); font-size: 14px; letter-spacing: 2px; }
        .badge-count { background: #123d24; color: var(--primary); width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; }

        .preset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .preset-header { display: flex; gap: 16px; margin-bottom: 16px; }
        .preset-thumb { width: 70px; height: 70px; background: #444; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; }
        .preset-info h4 { font-size: 15px; margin-bottom: 6px; font-weight: 700; }
        .tag-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .tag { background: rgba(0, 250, 126, 0.1); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid rgba(0, 250, 126, 0.3); }
        .tag.dark { background: #2a2a2d; color: #a0a0a0; border-color: transparent; }
        .link-box { background: #000; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #a0a0a0; word-break: break-all; margin-bottom: 16px; border: 1px solid #222; }
        .action-btns { display: flex; gap: 12px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .btn-action.primary { background: var(--primary); color: #000; border: none; }
        .btn-action.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        
        .error-msg { background: #ff3333; color: white; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg></div>
            AM Preset Finder
        </div>
    </header>

    <main>
        <div id="searchView">
            <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">
                Masukkan link video TikTok untuk mencari link preset secara Real-Time.
            </div>
            <div class="error-msg" id="errMsg"></div>

            <div class="search-container">
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="https://vt.tiktok.com/...">
                </div>
                <button class="btn-primary" onclick="handleSearch()">Cari</button>
            </div>

            <div class="pills">
                <div class="pill">Tempel link TikTok lu di sini</div>
            </div>
        </div>

        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div style="font-weight: 600;">Memindai TikTok (Real)...</div>
        </div>

        <div class="result-state" id="resultState">
            <div class="video-box" id="resVideoBox"></div>
            <div class="caption-text" id="resDesc"></div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">AKUN</span>
                    <div class="stat-value">
                        <div class="avatar-sm" id="resAvatar"></div> <span id="resAuthor">@...</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">KOMENTAR</span>
                    <span class="stat-value" id="resComments">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">DITONTON</span>
                    <span class="stat-value" id="resViews">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">SUKA</span>
                    <span class="stat-value" id="resLikes">0</span>
                </div>
            </div>

            <div class="audio-bar">
                <div class="audio-info">
                    <div class="audio-thumb" id="resMusicCover"></div>
                    <div>
                        <div class="audio-title" id="resMusicTitle">-</div>
                        <div class="audio-subtitle" id="resMusicAuthor">-</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="preset-section-title">
                    <span>======///</span> Link preset <div class="badge-count" id="resPresetCount">0</div>
                </div>
                <div id="presetContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // GANTI URL INI KALAU BACKEND LU UDAH DI-DEPLOY (misal ke vercel/render)
        // Kalau jalan di laptop lokal, biarin localhost:3000
        const API_BASE_URL = 'http://localhost:3000';

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function handleSearch() {
            const input = document.getElementById('searchInput').value.trim();
            const errMsg = document.getElementById('errMsg');
            
            if (!input) {
                errMsg.innerText = 'Masukin link TikTok dulu, gng.';
                errMsg.style.display = 'block';
                return;
            }
            errMsg.style.display = 'none';

            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('loadingState').classList.add('active');
            document.getElementById('resultState').classList.remove('active');

            try {
                const response = await fetch(`${API_BASE_URL}/api/search?url=${encodeURIComponent(input)}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Gagal ambil data');

                // Populate UI
                document.getElementById('resAuthor').innerText = '@' + data.author.username;
                document.getElementById('resAvatar').style.backgroundImage = `url(${data.author.avatar})`;
                document.getElementById('resComments').innerText = formatNumber(data.stats.commentCount);
                document.getElementById('resViews').innerText = formatNumber(data.stats.playCount);
                document.getElementById('resLikes').innerText = formatNumber(data.stats.diggCount);
                
                document.getElementById('resDesc').innerText = data.desc;
                document.getElementById('resMusicTitle').innerText = data.music.title;
                document.getElementById('resMusicAuthor').innerText = data.music.author;
                document.getElementById('resMusicCover').style.backgroundImage = `url(${data.music.cover})`;
                
                // Fallback video background (karena thumbnail video gak dikasih sama API, pake bg default)
                document.getElementById('resVideoBox').style.backgroundImage = `url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=800&auto=format&fit=crop')`;

                // Render Presets
                const container = document.getElementById('presetContainer');
                const countBadge = document.getElementById('resPresetCount');
                container.innerHTML = '';
                countBadge.innerText = data.presets.length;

                if (data.presets.length === 0) {
                    container.innerHTML = `<div style="color: var(--text-muted); font-size: 14px; padding: 10px;">Gak ada link Alight Motion di deskripsi video ini, gng. Coba cek komen manual.</div>`;
                } else {
                    data.presets.forEach((preset, i) => {
                        const card = document.createElement('div');
                        card.className = 'preset-card';
                        card.innerHTML = `
                            <div class="preset-header">
                                <div class="preset-thumb" style="background-image: url('${data.music.cover}')"></div>
                                <div class="preset-info">
                                    <h4>${preset.title}</h4>
                                    <div class="tag-group">
                                        <span class="tag">${preset.size}</span>
                                        <span class="tag dark">${preset.source.toUpperCase()}</span>
                                    </div>
                                    <div class="preset-sub">@${data.author.username}</div>
                                </div>
                            </div>
                            <div class="link-box">${preset.link}</div>
                            <div class="action-btns">
                                <a href="${preset.link}" target="_blank" class="btn-action primary">
                                    Buka
                                </a>
                                <button class="btn-action outline" onclick="navigator.clipboard.writeText('${preset.link}'); this.innerText='✅ Tersalin'; setTimeout(()=>this.innerText='Salin', 2000)">
                                    Salin
                                </button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                document.getElementById('loadingState').classList.remove('active');
                document.getElementById('resultState').classList.add('active');

            } catch (err) {
                document.getElementById('loadingState').classList.remove('active');
                document.getElementById('searchView').classList.remove('hidden');
                errMsg.innerText = err.message;
                errMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
