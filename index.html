<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Class Voting</title>
    
    <!-- Import Font Aesthetic (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palet Warna Estetik */
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            
            /* Aksen Neon */
            --accent-purple: #8a2be2;
            --accent-pink: #ff007f;
            --accent-gradient: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            --glow: 0 0 15px rgba(255, 0, 127, 0.5);
            
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        /* FIX 1: Perbaikan Layout Mobile agar tidak terpotong */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Mencegah layar ikut kescroll */
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-body);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        /* Container Utama */
        #app {
            width: 100%;
            max-width: 480px;
            height: 100%; /* Mengisi tinggi layar dengan pas */
            display: flex;
            flex-direction: column;
            position: relative;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            z-index: 1;
        }

        /* Header */
        header {
            padding: 25px 20px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        header h1 {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            font-weight: bold;
        }

        .icon-btn:active {
            background: rgba(255,255,255,0.2);
        }

        /* Bar Nama User */
        .user-bar {
            margin: 0 20px 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px 18px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .user-bar span {
            color: var(--text-muted);
        }

        .user-bar input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--accent-pink);
            font-weight: 700;
            outline: none;
            font-size: 14px;
            font-family: var(--font-head);
        }

        .user-bar input::placeholder {
            color: #555;
            font-weight: 400;
            font-family: var(--font-body);
        }

        /* Area Scroll Polling */
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 20px 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Polling (Glassmorphism) */
        .poll-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .creator-name {
            font-size: 12px;
            color: var(--accent-pink);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .poll-header h3 {
            font-family: var(--font-head);
            font-size: 18px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .poll-type {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Opsi Voting */
        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .option-item.selected {
            border-color: var(--accent-purple);
            background: rgba(138, 43, 226, 0.1);
        }

        /* Custom Radio/Checkbox */
        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
            margin-top: 2px;
            transition: 0.2s;
        }

        .option-item.selected .radio-circle {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: var(--glow);
        }

        .option-item.selected .radio-circle::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .option-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .option-text {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
        }

        .voters-list {
            font-size: 11px;
            color: #ffb3d9;
            margin-top: 6px;
            font-weight: 600;
            display: none; 
        }

        .option-item.voted .voters-list {
            display: block;
        }

        .vote-count {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-pink);
            z-index: 2;
            margin-left: 10px;
            display: none;
        }

        .option-item.voted .vote-count {
            display: block;
        }

        /* Bar Persentase */
        .progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(138,43,226,0.2), rgba(255,0,127,0.2));
            z-index: 1;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }

        .option-item.voted .progress-bar {
            display: block;
        }

        /* Footer Card Polling */
        .poll-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 12px;
        }

        .vote-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: var(--font-head);
            font-size: 14px;
            display: none; 
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.3s;
        }
        
        .vote-btn.active {
            display: block;
        }

        .voted-badge {
            color: var(--accent-pink);
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* FAB (Tombol Buat) */
        .fab {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4);
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
        }

        /* FIX 2: Modal Diperbaiki agar tidak error */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            z-index: 999; /* Z-index tinggi agar pasti muncul di atas */
            display: none;
            flex-direction: column;
        }

        .modal.active {
            display: flex !important; /* Paksa muncul */
        }

        .modal-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-header h2 {
            font-family: var(--font-head);
            font-size: 20px;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--accent-purple);
            background: rgba(138, 43, 226, 0.05);
        }

        .add-option-btn {
            background: transparent;
            color: var(--accent-pink);
            border: 1px dashed var(--accent-pink);
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        /* Setting Toggle */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid var(--glass-border);
            font-size: 14px;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background: var(--accent-gradient); }
        input:checked + .slider:before { transform: translateX(20px); }

        .submit-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-head);
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.3s;
        }

        /* Scrollbar Aesthetic */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header>
        <h1>VIBE VOTING ✦</h1>
        <!-- Ditambahkan type="button" agar tidak bentrok -->
        <button type="button" class="icon-btn" onclick="openCreateModal()">+</button>
    </header>

    <!-- Input Nama Pemilih -->
    <div class="user-bar">
        <span>ID:</span>
        <input type="text" id="userNameInput" placeholder="Masukkan namamu..." oninput="saveUserName()">
    </div>

    <!-- Area Polling -->
    <main id="pollContainer">
        <!-- Card Polling akan di-render lewat JS -->
    </main>

    <!-- FAB -->
    <div class="fab" onclick="openCreateModal()">✦</div>

    <!-- Modal Buat Polling -->
    <div class="modal" id="createModal">
        <div class="modal-header">
            <button type="button" class="icon-btn" onclick="closeCreateModal()">←</button>
            <h2>Buat Polling</h2>
        </div>
        
        <div class="modal-body">
            <div class="input-group">
                <label>Nama Pembuat</label>
                <input type="text" id="creatorNameInput" class="input-field" placeholder="Namamu siapa?" maxlength="50">
            </div>

            <div class="input-group">
                <label>Pertanyaan</label>
                <input type="text" id="pollQuestion" class="input-field" placeholder="Mau nanya apa?" maxlength="255">
            </div>

            <div class="input-group" id="optionsContainer">
                <label>Pilihan Jawaban</label>
                <!-- Input opsi dinamis -->
            </div>

            <button type="button" class="add-option-btn" onclick="addOptionInput()">+ Tambah Pilihan</button>

            <div class="setting-row">
                <span>Bisa pilih lebih dari 1?</span>
                <label class="switch">
                    <input type="checkbox" id="allowMultiple">
                    <span class="slider"></span>
                </label>
            </div>

            <button type="button" class="submit-btn" onclick="createPoll()">Publish Voting 🚀</button>
        </div>
    </div>
</div>

<script>
    // FIX 3: Membungkus LocalStorage dengan Try-Catch agar tidak crash di browser tertentu
    let polls = [];
    let votedPolls = [];
    let currentUser = '';
    let tempSelections = {}; 

    try {
        const storedPolls = localStorage.getItem('class_polls_v3');
        if (storedPolls) polls = JSON.parse(storedPolls);
        
        const storedVoted = localStorage.getItem('voted_polls_v3');
        if (storedVoted) votedPolls = JSON.parse(storedVoted);
        
        const storedName = localStorage.getItem('current_user_name');
        if (storedName) currentUser = storedName;
    } catch (e) {
        console.warn("Akses LocalStorage diblokir browser. Voting tetap jalan tapi data tidak tersimpan permanen.");
    }

    function saveToLocalStorage() {
        try {
            localStorage.setItem('class_polls_v3', JSON.stringify(polls));
            localStorage.setItem('voted_polls_v3', JSON.stringify(votedPolls));
            localStorage.setItem('current_user_name', currentUser);
        } catch (e) {}
    }

    // Pastikan DOM sudah diload sebelum render
    document.addEventListener('DOMContentLoaded', () => {
        if (currentUser) {
            const nameInput = document.getElementById('userNameInput');
            if(nameInput) nameInput.value = currentUser;
        }
        renderPolls();
    });

    function saveUserName() {
        const nameInput = document.getElementById('userNameInput');
        if(nameInput) {
            currentUser = nameInput.value.trim();
            saveToLocalStorage();
        }
    }

    // Render Polling
    function renderPolls() {
        const container = document.getElementById('pollContainer');
        if (!container) return;
        
        container.innerHTML = '';

        if (polls.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#a0a0b0; margin-top:50px; font-size:14px; padding:20px;">Belum ada votingan nih.<br>Klik tombol + untuk bikin!</div>';
            return;
        }

        polls.slice().reverse().forEach(poll => {
            const hasVoted = votedPolls.includes(poll.id);
            const totalVotes = poll.options.reduce((sum, opt) => sum + opt.voters.length, 0);
            
            const card = document.createElement('div');
            card.className = 'poll-card';

            let typeText = poll.allowMultiple ? 'Multi-Choice' : 'Single-Choice';
            let headerHTML = `
                <div class="creator-name">CREATED BY: ${poll.creator}</div>
                <div class="poll-header">
                    <h3>${poll.question}</h3>
                    <div class="poll-type">⚡ ${typeText}</div>
                </div>
                <div class="poll-options">
            `;

            poll.options.forEach(opt => {
                let percentage = totalVotes === 0 ? 0 : Math.round((opt.voters.length / totalVotes) * 100);
                let selectedClass = '';
                
                if (!hasVoted) {
                    if(tempSelections[poll.id] && tempSelections[poll.id].includes(opt.id)) {
                        selectedClass = 'selected';
                    }
                } else {
                    selectedClass = 'voted';
                }

                let votersHTML = '';
                if(hasVoted && opt.voters.length > 0) {
                    votersHTML = `<div class="voters-list">👤 ${opt.voters.join(', ')}</div>`;
                }

                let progressBar = hasVoted ? `<div class="progress-bar" style="width: ${percentage}%;"></div>` : '';
                let voteCountText = hasVoted ? `<span class="vote-count">${opt.voters.length}</span>` : '';

                headerHTML += `
                    <div class="option-item ${selectedClass}" onclick="toggleSelection('${poll.id}', '${opt.id}')">
                        ${progressBar}
                        <div class="radio-circle"></div>
                        <div class="option-content">
                            <div class="option-text">${opt.text}</div>
                            ${votersHTML}
                        </div>
                        ${voteCountText}
                    </div>
                `;
            });

            headerHTML += `</div>`; 

            let footerHTML = '';
            if (!hasVoted) {
                let isSelected = tempSelections[poll.id] && tempSelections[poll.id].length > 0;
                footerHTML = `
                    <div class="poll-footer">
                        <button type="button" class="vote-btn ${isSelected ? 'active' : ''}" onclick="submitVote('${poll.id}')">Kirim Suara</button>
                    </div>
                `;
            } else {
                footerHTML = `
                    <div class="poll-footer" style="justify-content: space-between; width:100%;">
                        <span class="voted-badge">✓ Kamu sudah vote</span>
                        <span style="color: var(--text-muted);">${totalVotes} Suara</span>
                    </div>
                `;
            }

            card.innerHTML = headerHTML + footerHTML;
            container.appendChild(card);
        });
    }

    // Pilih Opsi
    function toggleSelection(pollId, optionId) {
        if (votedPolls.includes(pollId)) return; 

        const poll = polls.find(p => p.id === pollId);
        if (!poll) return;

        if (!tempSelections[pollId]) tempSelections[pollId] = [];

        let index = tempSelections[pollId].indexOf(optionId);

        if (poll.allowMultiple) {
            if (index > -1) tempSelections[pollId].splice(index, 1); 
            else tempSelections[pollId].push(optionId); 
        } else {
            tempSelections[pollId] = [optionId]; 
        }

        renderPolls(); 
    }

    // Kirim Vote
    function submitVote(pollId) {
        if (!currentUser) {
            alert('Isi ID/Nama kamu di atas dulu ya biar tau siapa yang vote!');
            const nameInput = document.getElementById('userNameInput');
            if(nameInput) nameInput.focus();
            return;
        }

        if (!tempSelections[pollId] || tempSelections[pollId].length === 0) return;

        const pollIndex = polls.findIndex(p => p.id === pollId);
        if (pollIndex === -1) return;

        tempSelections[pollId].forEach(selectedOptId => {
            const optIndex = polls[pollIndex].options.findIndex(o => o.id === selectedOptId);
            if (optIndex !== -1) {
                polls[pollIndex].options[optIndex].voters.push(currentUser);
            }
        });

        votedPolls.push(pollId);
        saveToLocalStorage(); // Panggil fungsi save yang aman

        delete tempSelections[pollId];
        renderPolls(); 
    }

    // Buka Modal
    function openCreateModal() {
        const modal = document.getElementById('createModal');
        if (modal) {
            modal.classList.add('active');
            
            const creatorInput = document.getElementById('creatorNameInput');
            if(creatorInput) creatorInput.value = currentUser || '';
            
            const qInput = document.getElementById('pollQuestion');
            if(qInput) qInput.value = '';
            
            const multiInput = document.getElementById('allowMultiple');
            if(multiInput) multiInput.checked = true;
            
            const container = document.getElementById('optionsContainer');
            if(container) {
                container.innerHTML = '<label>Pilihan Jawaban</label>';
                addOptionInput();
                addOptionInput();
            }
        }
    }

    function closeCreateModal() {
        const modal = document.getElementById('createModal');
        if(modal) modal.classList.remove('active');
    }

    function addOptionInput() {
        const container = document.getElementById('optionsContainer');
        if(!container) return;

        const inputDiv = document.createElement('div');
        inputDiv.style.marginBottom = '10px';
        inputDiv.innerHTML = `<input type="text" class="input-field option-input" placeholder="Teks Pilihan..." maxlength="100">`;
        container.appendChild(inputDiv);
    }

    // Proses Bikin Polling
    function createPoll() {
        const creatorEl = document.getElementById('creatorNameInput');
        const questionEl = document.getElementById('pollQuestion');
        const allowMultipleEl = document.getElementById('allowMultiple');
        
        if (!creatorEl || !questionEl || !allowMultipleEl) return;

        const creator = creatorEl.value.trim();
        const question = questionEl.value.trim();
        const allowMultiple = allowMultipleEl.checked;
        const optionInputs = document.querySelectorAll('.option-input');
        
        let options = [];
        optionInputs.forEach(input => {
            if (input.value.trim() !== '') {
                options.push({
                    id: 'opt_' + Math.random().toString(36).substr(2, 9),
                    text: input.value.trim(),
                    voters: [] 
                });
            }
        });

        if (creator === '') {
            alert('Nama pembuat wajib diisi!');
            return;
        }
        if (question === '') {
            alert('Pertanyaannya jangan kosong dong!');
            return;
        }
        if (options.length < 2) {
            alert('Minimal bikin 2 pilihan jawaban!');
            return;
        }

        const newPoll = {
            id: 'poll_' + Date.now().toString(),
            creator: creator,
            question: question,
            allowMultiple: allowMultiple,
            options: options,
            date: Date.now()
        };

        polls.push(newPoll);
        saveToLocalStorage(); // Panggil fungsi save yang aman

        closeCreateModal();
        renderPolls();
    }
</script>

</body>
</html>
