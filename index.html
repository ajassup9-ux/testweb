<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Preset Finder - Reply Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f; --surface: #1a1a1d; --primary: #00fa7e;
            --primary-dim: rgba(0, 250, 126, 0.15); --text: #ffffff;
            --text-muted: #8a8d93; --border: #2a2a2d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
        .logo-icon { width: 32px; height: 32px; border: 2px solid var(--text-muted); border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .logo-icon svg { width: 20px; height: 20px; fill: var(--primary); }

        main { flex: 1; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .search-container { display: flex; gap: 12px; margin-bottom: 16px; }
        .input-wrapper { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 16px; }
        .input-wrapper svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; margin-right: 12px; }
        .input-wrapper input { background: none; border: none; color: var(--text); width: 100%; padding: 14px 0; font-size: 14px; outline: none; }
        .btn-primary { background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 0 24px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.95); }

        .loading-state { display: none; flex-direction: column; align-items: center; padding: 40px 0; gap: 16px; }
        .loading-state.active { display: flex; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(0, 250, 126, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-state { display: none; flex-direction: column; gap: 16px; }
        .result-state.active { display: flex; }
        
        .video-box { width: 100%; aspect-ratio: 9/16; max-height: 500px; background: #000; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .caption-text { font-size: 13px; color: #e0e0e0; line-height: 1.5; word-wrap: break-word; }
        .caption-text a { color: var(--primary); text-decoration: none; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 8px 0; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background-size: cover; background-position: center; }

        .audio-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .audio-info { display: flex; align-items: center; gap: 12px; }
        .audio-thumb { width: 44px; height: 44px; border-radius: 50%; background-size: cover; background-position: center; position: relative; display: flex; justify-content: center; align-items: center; }
        .audio-thumb::after { content: '🎵'; position: absolute; bottom: -2px; left: -2px; background: var(--primary); border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; justify-content: center; align-items: center; border: 2px solid var(--bg); }
        
        .audio-title { font-size: 14px; font-weight: 600; }
        .audio-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .preset-section-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; margin-top: 10px; margin-bottom: 16px; }
        .preset-section-title span { color: var(--primary); font-size: 14px; letter-spacing: 2px; }
        .badge-count { background: #123d24; color: var(--primary); width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; }

        .preset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .preset-header { display: flex; gap: 16px; margin-bottom: 16px; }
        .preset-thumb { width: 70px; height: 70px; background: #444; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; }
        .preset-info h4 { font-size: 15px; margin-bottom: 6px; font-weight: 700; }
        .tag-group { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        .tag { background: rgba(0, 250, 126, 0.1); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid rgba(0, 250, 126, 0.3); }
        .tag.dark { background: #2a2a2d; color: #a0a0a0; border-color: transparent; }
        .tag.yellow { background: rgba(255, 204, 0, 0.1); color: #ffcc00; border-color: rgba(255, 204, 0, 0.3); }
        .link-box { background: #000; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #a0a0a0; word-break: break-all; margin-bottom: 16px; border: 1px solid #222; }
        .action-btns { display: flex; gap: 12px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .btn-action.primary { background: var(--primary); color: #000; border: none; }
        .btn-action.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        
        .error-msg { background: #ff3333; color: white; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        .hidden { display: none !important; }
        
        .progress-text { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg></div>
            AM Preset Finder
        </div>
    </header>

    <main>
        <div id="searchView">
            <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">
                Deep Scan (Deskripsi + Komen + Balasan Komen).
            </div>
            <div class="error-msg" id="errMsg"></div>

            <div class="search-container">
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="https://vt.tiktok.com/..." value="https://www.tiktok.com/@byptryaa21/video/7414824196540947730">
                </div>
                <button class="btn-primary" onclick="handleSearch()">Cari</button>
            </div>
        </div>

        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div style="font-weight: 600;">Memindai Video & Balasan Komen...</div>
            <div class="progress-text" id="progressText"></div>
        </div>

        <div class="result-state" id="resultState">
            <video id="resVideo" class="video-box" controls autoplay loop muted playsinline></video>
            
            <div class="caption-text" id="resDesc"></div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">AKUN</span>
                    <div class="stat-value">
                        <div class="avatar-sm" id="resAvatar"></div> <span id="resAuthor">@...</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">DITONTON</span>
                    <span class="stat-value" id="resViews">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">SUKA</span>
                    <span class="stat-value" id="resLikes">0</span>
                </div>
            </div>

            <div class="audio-bar">
                <div class="audio-info">
                    <div class="audio-thumb" id="resMusicCover"></div>
                    <div>
                        <div class="audio-title" id="resMusicTitle">-</div>
                        <div class="audio-subtitle" id="resMusicAuthor">-</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="preset-section-title">
                    <span>======///</span> Hasil Deteksi <div class="badge-count" id="resPresetCount">0</div>
                </div>
                <div id="presetContainer"></div>
            </div>
        </div>
    </main>

    <script>
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function handleSearch() {
            const input = document.getElementById('searchInput').value.trim();
            const errMsg = document.getElementById('errMsg');
            const progressText = document.getElementById('progressText');
            
            if (!input) {
                errMsg.innerText = 'Masukin link TikTok dulu, gng.';
                errMsg.style.display = 'block';
                return;
            }
            errMsg.style.display = 'none';

            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('loadingState').classList.add('active');
            document.getElementById('resultState').classList.remove('active');
            progressText.innerText = 'Menarik data video utama...';

            try {
                // 1. TARIK DATA VIDEO UTAMA
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(input)}`);
                const json = await response.json();

                if (json.code !== 0 || !json.data) {
                    throw new Error('Link invalid atau video di-private.');
                }

                const data = json.data;

                // Tampilin video asli
                const videoEl = document.getElementById('resVideo');
                videoEl.src = data.play; 
                videoEl.load(); 

                // Isi metadata
                document.getElementById('resAuthor').innerText = '@' + data.author.unique_id;
                document.getElementById('resAvatar').style.backgroundImage = `url(${data.author.avatar})`;
                document.getElementById('resViews').innerText = formatNumber(data.play_count);
                document.getElementById('resLikes').innerText = formatNumber(data.digg_count);
                
                document.getElementById('resDesc').innerText = data.title;
                document.getElementById('resMusicTitle').innerText = data.music_info.title;
                document.getElementById('resMusicAuthor').innerText = data.music_info.author;
                document.getElementById('resMusicCover').style.backgroundImage = `url(${data.music_info.cover})`;

                // 2. ULTRA DEEP SCAN (Komen + Reply)
                let foundLinks = [];
                let cursor = 0;
                let hasMore = true;
                let totalFetched = 0;
                const maxComments = 1000; // Batas maksimal

                const urlRegex = /(https?:\/\/(?:www\.)?(?:alightcreative|alightmotion)\.com\/[^\s]+)/gi;

                progressText.innerText = 'Memulai Deep Scan Komentar & Balasan...';

                // Scan deskripsi dulu
                const descUrls = data.title.match(urlRegex);
                if (descUrls) descUrls.forEach(u => foundLinks.push(u.replace(/[.,;!?]+$/, '')));

                // Loop Komen Utama
                while (hasMore && totalFetched < maxComments) {
                    progressText.innerText = `Memindai komentar (${totalFetched} / ${maxComments})...`;
                    
                    try {
                        const commentRes = await fetch(`https://www.tikwm.com/api/comment/list/?url=${encodeURIComponent(input)}&count=20&cursor=${cursor}`);
                        const commentJson = await commentRes.json();
                        
                        if (commentJson.code === 0 && commentJson.data && commentJson.data.comments && commentJson.data.comments.length > 0) {
                            let foundUrlInPage = false;

                            for (const c of commentJson.data.comments) {
                                // Cek komen utama
                                const urls = c.text.match(urlRegex);
                                if (urls) {
                                    urls.forEach(u => {
                                        const cleanLink = u.replace(/[.,;!?]+$/, '');
                                        if (!foundLinks.includes(cleanLink)) {
                                            foundLinks.push(cleanLink);
                                            foundUrlInPage = true;
                                        }
                                    });
                                }

                                totalFetched++;
                                if (totalFetched >= maxComments || foundUrlInPage) break;

                                // Cek Reply (Balasan) jika ada
                                if (c.reply_comment_total > 0) {
                                    progressText.innerText = `Memeriksa balasan komen (${totalFetched} / ${maxComments})...`;
                                    try {
                                        const replyRes = await fetch(`https://www.tikwm.com/api/comment/reply/list/?url=${encodeURIComponent(input)}&cid=${c.cid}&count=20`);
                                        const replyJson = await replyRes.json();
                                        
                                        if (replyJson.code === 0 && replyJson.data && replyJson.data.comments) {
                                            replyJson.data.comments.forEach(r => {
                                                const rUrls = r.text.match(urlRegex);
                                                if (rUrls) {
                                                    rUrls.forEach(u => {
                                                        const cleanLink = u.replace(/[.,;!?]+$/, '');
                                                        if (!foundLinks.includes(cleanLink)) {
                                                            foundLinks.push(cleanLink);
                                                            foundUrlInPage = true;
                                                        }
                                                    });
                                                }
                                            });
                                        }
                                    } catch (e) {
                                        console.log("Gagal narik reply", e);
                                    }
                                    // Delay bentar biar gak kena rate-limit
                                    await new Promise(r => setTimeout(r, 100));
                                }
                            }
                            
                            const newCursor = commentJson.data.cursor;
                            hasMore = commentJson.data.has_more && newCursor !== cursor; 
                            cursor = newCursor;

                            if (foundUrlInPage) {
                                progressText.innerText = `Link AM ketemu! Menyelesaikan...`;
                                hasMore = false; 
                            }
                        } else {
                            hasMore = false;
                        }
                    } catch (e) {
                        console.log("Error fetching comments page.");
                        hasMore = false;
                    }
                    
                    await new Promise(r => setTimeout(r, 300)); 
                }

                progressText.innerText = `Selesai memindai.`;

                // 3. RENDER HASIL
                const container = document.getElementById('presetContainer');
                const countBadge = document.getElementById('resPresetCount');
                container.innerHTML = '';
                
                countBadge.innerText = foundLinks.length;

                if (foundLinks.length === 0) {
                    container.innerHTML = `<div style="color: var(--text-muted); font-size: 14px; padding: 10px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border);">Gila, udah di-scan komen & balasannya tetep gak ada link Alight Motion asli. Bisa jadi beneran kosong atau di bio.</div>`;
                } else {
                    foundLinks.forEach((link, i) => {
                        const card = document.createElement('div');
                        card.className = 'preset-card';
                        card.innerHTML = `
                            <div class="preset-header">
                                <div class="preset-thumb" style="background-image: url('${data.cover}')"></div>
                                <div class="preset-info">
                                    <h4>Link AM #${i + 1}</h4>
                                    <div class="tag-group">
                                        <span class="tag">REAL LINK</span>
                                        <span class="tag dark">KOMENTAR/BALASAN</span>
                                    </div>
                                    <div class="preset-sub">Berhasil dideteksi</div>
                                </div>
                            </div>
                            <div class="link-box">${link}</div>
                            <div class="action-btns">
                                <a href="${link}" target="_blank" class="btn-action primary">
                                    Buka
                                </a>
                                <button class="btn-action outline" onclick="navigator.clipboard.writeText('${link}'); this.innerText='✅ Tersalin'; setTimeout(()=>this.innerText='Salin', 2000)">
                                    Salin
                                </button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                document.getElementById('loadingState').classList.remove('active');
                document.getElementById('resultState').classList.add('active');

            } catch (err) {
                document.getElementById('loadingState').classList.remove('active');
                document.getElementById('searchView').classList.remove('hidden');
                errMsg.innerText = err.message;
                errMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
