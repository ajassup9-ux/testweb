<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Our Story</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">Rumah</a>
        <a href="gallery.html" class="active">Memori</a>
        <a href="gallery.html" class="active">Galeri</a>
        <a href="message.html">Pesan</a>
        <a href="reasons.html">Alasan</a>
    </div>

    <div class="container">
        <h1 class="page-title">Galeri 🌸</h1>
        
        <div class="gallery-grid">
            
            <!-- FOTO 1 (Ganti link src pake catbox foto lu) -->
            <div class="polaroid">
                <img src="https://files.catbox.moe/x3tpjr.jpg" alt="Memori 1">
            </div>

            <!-- VIDEO (Ganti link src pake catbox .mp4 lu) -->
            <div class="polaroid" style="padding-bottom: 12px;">
                <video id="videoMemori" src="https://files.catbox.moe/ir57p7.mp4" autoplay loop muted controls playsinline></video>
            </div>

        </div>
    </div>

    <!-- Script Utama -->
    <script src="script.js"></script>

    <!-- Script Biar Video Suaranya Nyala Pas Diklik -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById('videoMemori');
            
            if (video) {
                // Paksa muter otomatis pas web dibuka (walau masih bisu)
                video.play().catch(e => console.log("Browser ngeblokir autoplay."));

                // Kalau videonya diklik, suaranya otomatis nyala
                video.addEventListener('click', () => {
                    video.muted = false; // Buka mode bisu
                    video.play();
                });
            }
        });
    </script>
</body>
</html>
